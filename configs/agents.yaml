# Agent configurations

agents:
  # Base configuration for all agents
  base:
    llm_provider: "nemotron"
    temperature: 0.1
    max_tokens: 4096
    system_prompt_template: "base"
    allowed_tools: []
    allowed_networks: ["ctf_workspace"]
    cpu_limit: "1.0"
    memory_limit: "2g"
    pids_limit: 100

  # Orchestrator agent
  orchestrator:
    role: "orchestrator"
    description: "Central coordination engine for challenge solving"
    capabilities:
      - "challenge_intake"
      - "challenge_classification"
      - "task_decomposition"
      - "agent_selection"
      - "parallel_scheduling"
      - "resource_allocation"
      - "result_aggregation"
      - "contradiction_detection"
      - "exploitation_coordination"
      - "final_validation"
    allowed_tools:
      - "challenge_triage"
      - "agent_spawn"
      - "memory_query"
      - "evidence_submit"
      - "experiment_create"
      - "report_generate"

  # Web exploitation agent
  web:
    role: "web"
    description: "Web application security testing and exploitation"
    capabilities:
      - "http_reconnaissance"
      - "api_analysis"
      - "injection_testing"
      - "authentication_analysis"
      - "client_side_analysis"
      - "ssrf_testing"
      - "xxe_testing"
      - "ssti_testing"
    allowed_tools:
      - "ffuf"
      - "feroxbuster"
      - "gobuster"
      - "httpx"
      - "nuclei"
      - "katana"
      - "hakrawler"
      - "sqlmap"
      - "curl"
      - "mitmproxy"
      - "dirsearch"
    allowed_networks:
      - "ctf_workspace"
      - "ctf_targets"

  # Cryptography agent
  crypto:
    role: "crypto"
    description: "Cryptographic analysis and exploitation"
    capabilities:
      - "cipher_identification"
      - "weak_crypto_detection"
      - "side_channel_analysis"
      - "protocol_analysis"
      - "hash_cracking"
      - "rsa_analysis"
      - "ecc_analysis"
      - "symmetric_analysis"
    allowed_tools:
      - "openssl"
      - "hashcat"
      - "john"
      - "sage"
      - "sympy"
      - "gmpy2"
      - "z3"
      - "python"
    allowed_networks:
      - "ctf_workspace"

  # Binary exploitation / Pwn agent
  pwn:
    role: "pwn"
    description: "Binary exploitation and memory corruption"
    capabilities:
      - "binary_triage"
      - "memory_corruption_analysis"
      - "protection_analysis"
      - "libc_analysis"
      - "exploit_construction"
      - "rop_chain_generation"
      - "heap_exploitation"
      - "format_string_exploitation"
    allowed_tools:
      - "gdb"
      - "pwndbg"
      - "pwntools"
      - "checksec"
      - "ROPgadget"
      - "ropper"
      - "patchelf"
      - "readelf"
      - "objdump"
      - "nm"
      - "strace"
      - "ltrace"
      - "qemu"
    allowed_networks:
      - "ctf_workspace"
      - "ctf_targets"

  # Reverse engineering agent
  reverse:
    role: "reverse"
    description: "Reverse engineering and binary analysis"
    capabilities:
      - "static_analysis"
      - "dynamic_analysis"
      - "decompilation"
      - "control_flow_analysis"
      - "data_flow_analysis"
      - "anti_reversing_detection"
      - "vm_analysis"
      - "obfuscation_analysis"
    allowed_tools:
      - "ghidra"
      - "radare2"
      - "cutter"
      - "angr"
      - "z3"
      - "gdb"
      - "lldb"
      - "python"
    allowed_networks:
      - "ctf_workspace"

  # Forensics agent
  forensics:
    role: "forensics"
    description: "Digital forensics and artifact analysis"
    capabilities:
