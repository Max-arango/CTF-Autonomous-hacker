# Permission Manager Configuration

permissions:
  # Default deny policy
  default_policy: "deny"

  # Capability definitions - minimal set
  capabilities:
    READ_AUDIT_LOGS:
      description: "Read audit log entries"
      risk: "low"
      allowed_agents: ["orchestrator", "meta"]
      requires_approval: false
      parameters:
        limit:
          type: "integer"
          maximum: 1000
        filter:
          type: "object"
          optional: true

  # Agent-specific permissions - only READ_AUDIT_LOGS
  agent_permissions:
    orchestrator:
      - "READ_AUDIT_LOGS"

    web:
      - "READ_AUDIT_LOGS"

    crypto:
      - "READ_AUDIT_LOGS"

    pwn:
      - "READ_AUDIT_LOGS"

    reverse:
      - "READ_AUDIT_LOGS"

    forensics:
      - "READ_AUDIT_LOGS"

    osint:
      - "READ_AUDIT_LOGS"

    stego:
      - "READ_AUDIT_LOGS"

    mobile:
      - "READ_AUDIT_LOGS"

    malware:
      - "READ_AUDIT_LOGS"

    cloud:
      - "READ_AUDIT_LOGS"

    network:
      - "READ_AUDIT_LOGS"

    supply_chain:
      - "READ_AUDIT_LOGS"

    ad:
      - "READ_AUDIT_LOGS"

    web3:
      - "READ_AUDIT_LOGS"

    ai_security:
      - "READ_AUDIT_LOGS"

    sidechannel:
      - "READ_AUDIT_LOGS"

    firmware:
      - "READ_AUDIT_LOGS"

    social:
      - "READ_AUDIT_LOGS"

    programming:
      - "READ_AUDIT_LOGS"

    meta:
      - "READ_AUDIT_LOGS"