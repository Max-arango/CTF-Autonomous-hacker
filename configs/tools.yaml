# Tool Registry Configuration

tools:
  # Base tools (available in all containers)
  base:
    - name: "git"
      category: "version_control"
      binary: "git"
      version_check: "git --version"
      requires_root: false
      network_required: false
      container_profile: "base"
      security_risk: "low"
      supported_agents: ["*"]

    - name: "curl"
      category: "network"
      binary: "curl"
      version_check: "curl --version"
      requires_root: false
