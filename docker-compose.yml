      - ctf_workspace
    depends_on:
      orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4g"
    profiles:
      - agents
    # Security hardening
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    devices:
      - "/dev/kvm:/dev/kvm:rwm"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      - /run:rw,noexec,nosuid,size=100m

  agent-social:
    build:
      context: .
      dockerfile: docker/agent-social/Dockerfile
    container_name: ctf_agent_social
    environment:
      - PYTHONUNBUFFERED=1
      - AGENT_TYPE=social
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - PERMISSION_MANAGER_URL=http://permission-manager:8080
      - WORKSPACE_PATH=/workspace
      - ARTIFACTS_PATH=/artifacts
      - LOGS_PATH=/logs
    volumes:
      - social_workspace:/workspace:rw
      - artifacts:/artifacts:rw
      - logs:/logs:rw
    networks:
      - ctf_control
      - ctf_workspace
    depends_on:
      orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "2g"
    profiles:
      - agents
    # Security hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /run:rw,noexec,nosuid,size=100m

  agent-programming:
    build:
      context: .
      dockerfile: docker/agent-programming/Dockerfile
    container_name: ctf_agent_programming
    environment:
      - PYTHONUNBUFFERED=1
      - AGENT_TYPE=programming
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - PERMISSION_MANAGER_URL=http://permission-manager:8080
      - WORKSPACE_PATH=/workspace
      - ARTIFACTS_PATH=/artifacts
      - LOGS_PATH=/logs
    volumes:
      - programming_workspace:/workspace:rw
      - artifacts:/artifacts:rw
      - logs:/logs:rw
    networks:
      - ctf_control
      - ctf_workspace
    depends_on:
      orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4g"
    profiles:
      - agents
    # Security hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      - /run:rw,noexec,nosuid,size=100m

  agent-meta:
    build:
      context: .
      dockerfile: docker/agent-meta/Dockerfile
    container_name: ctf_agent_meta
    environment:
      - PYTHONUNBUFFERED=1
      - AGENT_TYPE=meta
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - PERMISSION_MANAGER_URL=http://permission-manager:8080
      - WORKSPACE_PATH=/workspace
      - ARTIFACTS_PATH=/artifacts
      - LOGS_PATH=/logs
    volumes:
      - meta_workspace:/workspace:rw
      - artifacts:/artifacts:rw
      - logs:/logs:rw
    networks:
      - ctf_control
      - ctf_workspace
