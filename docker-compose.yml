version: '3.8'

services:
  # Database
  db:
    image: postgres:16-alpine
    container_name: ctf_db
    environment:
      POSTGRES_DB: ctf
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ctf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ctf_control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctf"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "2g"

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ctf_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - ctf_control
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1g"

  # Vector Database (optional)
  qdrant:
    image: qdrant/qdrant:v1.10
    container_name: ctf_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ctf_control
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "2g"
    profiles:
      - vector

  # Permission Manager (SECURED - no Docker socket)
  permission-manager:
    build:
      context: .
      dockerfile: docker/permission-manager/Dockerfile
    container_name: ctf_permission_manager
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/app/configs/permissions.yaml
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://ctf:ctf@db:5432/ctf
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - workspace:/workspace:ro
      - artifacts:/artifacts:ro
      - logs:/logs:rw
      # REMOVED: /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ctf_control
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1g"
    # Security hardening
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN  # For tcpdump
      - SYS_ADMIN  # For mount operations
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /run:rw,noexec,nosuid,size=100m

  # Orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    container_name: ctf_orchestrator
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/app/configs/system.yaml
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://ctf:ctf@db:5432/ctf
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - PERMISSION_MANAGER_URL=http://permission-manager:8080
      - LLM_PROVIDER=nemotron
      - NEMOTRON_API_KEY=${NEMOTRON_API_KEY}
      - NEMOTRON_BASE_URL=https://integrate.api.nvidia.com/v1
      - NEMOTRON_MODEL=nemotron-3-5-lightning-free
      - WORKSPACE_PATH=/workspace
      - ARTIFACTS_PATH=/artifacts
      - LOGS_PATH=/logs
      - CTF_MODE=JEOPARDY
    volumes:
      - workspace:/workspace:rw
      - artifacts:/artifacts:rw
      - logs:/logs:rw
      - challenge:/challenge:ro
    networks:
      - ctf_control
      - ctf_workspace
      - ctf_targets
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      permission-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4g"
    # Security hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      - /run:rw,noexec,nosuid,size=100m

  # Agent containers (started on-demand by orchestrator)
