      - /run:rw,noexec,nosuid,size=100m

networks:
  ctf_control:
    driver: bridge
    name: ctf_control
    ipam:
      config:
        - subnet: 10.100.0.0/24
  ctf_workspace:
    driver: bridge
    name: ctf_workspace
    ipam:
      config:
        - subnet: 10.101.0.0/24
  ctf_targets:
