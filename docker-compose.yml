    name: ctf_targets
    ipam:
      config:
        - subnet: 10.102.0.0/24
  ctf_malware:
    driver: bridge
    name: ctf_malware
    ipam:
      config:
        - subnet: 10.103.0.0/24
    # No external gateway - isolated
  ctf_attack_defense:
